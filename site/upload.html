<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f7f2eb">
    <title>Share Wedding Memories</title>
    <link rel="stylesheet" href="./static/site.css">
    <script type="module" src="./static/app.js"></script>
</head>
<body>
    <main class="welcome-card">
        <p class="eyebrow">SHARE YOUR MEMORIES</p>
        <h1>Photos &amp; Videos</h1>
        <p class="description">
            Select the moments you captured. Images and videos up to 100 MB
            each are welcome.
        </p>
        <form id="upload-form" class="upload-form">
            <label class="file-picker" for="media-files">
                <span class="file-picker-title">Choose memories</span>
                <span id="selected-files" class="file-picker-detail">No files selected</span>
            </label>
            <input
                id="media-files"
                name="files"
                type="file"
                accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/quicktime,video/webm"
                multiple
                required
            >
            <button id="upload-button" class="button" type="submit">
                Upload selected files
            </button>
        </form>
        <p id="upload-status" class="status" role="status" aria-live="polite"></p>
        <p class="page-links">
            <a class="text-link" href="./gallery.html">View shared gallery</a>
            <a class="text-link" href="./index.html">Back to home</a>
        </p>
    </main>
</body>
</html>
